# yaml-language-server: $schema=https://app.pennsieve.io/static/schemas/app-manifest.v1.json
schemaVersion: '1.0'
name: DANDI CLI
description: Download files from a DANDI archive or upload workflow output to a destination Dandiset.
applicationType: processor
categories:
  - Data Transfer
tags:
  - DANDI
  - EMBER
  - download
  - upload
runtime:
  computeTypes:
    - standard
  gpu:
    enabled: false
resources:
  cpu: 1024
  memory: 2048
parameters:
  - name: DANDI_ACTION
    type: string
    defaultValue: "download"
  - name: DANDI_URL
    type: string
    defaultValue: ""
  - name: DATASET_ID
    type: string
    defaultValue: ""
  - name: DANDI_INSTANCE
    type: string
    defaultValue: "ember-dandi"
  - name: DANDISET_URL
    type: string
    defaultValue: ""
  - name: DESTINATION_PREFIX
    type: string
    defaultValue: "workflow-results"
  - name: UPLOAD_VALIDATION
    type: string
    defaultValue: "require"
# Inject DANDI_API_KEY through the platform's secret configuration.
# INPUT_DIR and OUTPUT_DIR are supplied by the workflow runtime.
# Download mode ignores INPUT_DIR; upload mode consumes it.
# DANDISET_URL is retained for compatibility but no longer used by upload.
inputs:
  - name: files
    dataType: any
    required: false
    description: Files to upload when DANDI_ACTION is upload; unused for download.
outputs:
  - name: downloaded_files
    dataType: any
    description: Downloaded files in download mode; upload-receipt.json in upload mode.
